name: generate-video
on:
  schedule:
    - cron: "30 5 * * *"    # video 1 (UTC)
    - cron: "30 13 * * *"   # video 2 (UTC)
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore daily quota / 30-day limit (1 = yes)"
        default: "0"
permissions:
  contents: write
concurrency:
  group: generate
  cancel-in-progress: false
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng
      - run: pip install -r requirements.txt
      - name: Prepare checkpoint directory
        run: mkdir -p .work/checkpoint
      - name: Restore resumable production checkpoint
        uses: actions/cache/restore@v4
        with:
          path: |
            .work/checkpoint
            .work/audio_library
          key: documentary-checkpoint-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            documentary-checkpoint-${{ github.ref_name }}-
      - name: Build and publish one video
        id: production
        env:
          CHECKPOINT_DIR: .work/checkpoint
          FORCE: ${{ github.event.inputs.force }}
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.pipeline
      - name: Ensure checkpoint cache has a file
        if: always()
        run: touch .work/checkpoint/.checkpoint-state
      - name: Check checkpoint cache size
        id: checkpoint_size
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          roots = [Path('.work/checkpoint'), Path('.work/audio_library')]
          size = sum(p.stat().st_size for root in roots for p in root.rglob('*') if p.is_file())
          limit = 5 * 1024 * 1024 * 1024
          print(f'Checkpoint cache size: {size / (1024 ** 3):.2f} GiB')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"cacheable={'true' if size <= limit else 'false'}\n")
          PY
      - name: Save resumable production checkpoint
        if: always() && steps.checkpoint_size.outputs.cacheable == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .work/checkpoint
            .work/audio_library
          key: documentary-checkpoint-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save memory
        if: always()
        run: |
          git config user.name "yt-bot"; git config user.email "bot@users.noreply.github.com"
          git add memory
          git diff --cached --quiet || (git commit -m "memory: new video" && git pull --rebase && git push)

