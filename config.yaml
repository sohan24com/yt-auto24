channel:
  niche: "Unsolved mysteries, hidden history and mind-bending science"
  tone: "cinematic, calm, curious, authoritative - like a premium streaming documentary"

start_date: "2026-11-23"   # day 1 of the 30-day run (UTC)
days: 30
videos_per_day: 2

# starting mix; analytics.py shifts it toward what actually performs
category_mix: {mystery: 0.7, history: 0.2, science: 0.1}

gemini_model: "gemini-2.5-flash"
gemini_fallbacks: ["gemini-2.5-flash-lite", "gemini-2.0-flash"] # discovered Gemini Flash text models

video:
  words_min: 1150
  words_max: 1400
  min_seconds: 450      # quality gate: 7.5 min
  max_seconds: 660      # quality gate: 11 min
  voice: "en-GB-RyanNeural"
  rate: "-4%"
  gemini_tts: false                                 # emotional narration via Gemini TTS; falls back to edge-tts
  gemini_tts_model: "gemini-3.1-flash-tts-preview"
  gemini_tts_fallback_model: "gemini-2.5-flash-preview-tts"
  gemini_voice: "Schedar"                           # male, even tone (alternatives: Sulafat, Umbriel, Zephyr)
  max_footage_reuse: 0.35

audio:
  target_lufs: -14.0
  true_peak_dbtp: -1.0
  lra: 10
  music_gain: 0.24
  key_information_music_scale: 0.55
  music_crossfade_seconds: 1.2
  voice_noise_reduction_db: 0
  scene_whoosh_max: 3
  max_ambience_cues: 3
  online_discovery: true
  max_discoveries_per_run: 3
  discovery_timeout_seconds: 45

story:
  minimum_quality_score: 76
  hook_max_seconds: 5
  min_progression_seconds: 20
  max_progression_seconds: 45
  min_outro_seconds: 8
  max_outro_seconds: 20

publishing:
  require_search_linked_fact_check: false
  require_license_manifest: true

youtube:
  privacy: "public"     # becomes forced-private until your API project passes Google's audit
  category_id: "27"     # Education
  synthetic_disclosure: false

shorts:
  enabled: true
  seconds: 50

drive:
  folder_name: "yt-doc-bot"
  retention_days: 3

optimize:
  thumb_swap_after_hours: 48
  ctr_threshold: 0.04

localization:                  # translated titles/descriptions shown to viewers in their own language
  enabled: true
  languages: [es, pt, hi, bn, ar, fr, de, id, ru, ja]

