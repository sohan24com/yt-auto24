channel:
  niche: "Unsolved mysteries, hidden history and mind-bending science"
  tone: "cinematic, calm, curious, authoritative - like a premium streaming documentary"

start_date: "2026-11-23"   # day 1 of the 30-day run (UTC)
days: 30
videos_per_day: 2

# starting mix; analytics.py shifts it toward what actually performs
category_mix: {mystery: 0.7, history: 0.2, science: 0.1}

gemini_model: "gemini-3.8-flash"
gemini_fallbacks: ["gemini-3.7-flash", "gemini-3.5-flash"]   # used automatically if a model returns 404

video:
  words_min: 1150
  words_max: 1600
  min_seconds: 450      # quality gate: 7.5 min
  max_seconds: 660      # quality gate: 11 min
  voice: "en-GB-RyanNeural"
  rate: "-4%"
  max_footage_reuse: 0.35

youtube:
  privacy: "public"     # becomes forced-private until your API project passes Google's audit
  category_id: "27"     # Education
  synthetic_disclosure: false

shorts:
  enabled: true
  seconds: 50

drive:
  folder_name: "yt-doc-bot"
  retention_days: 3

optimize:
  thumb_swap_after_hours: 48
  ctr_threshold: 0.04
